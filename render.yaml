services:
  - type: web
    name: sports-betting-study-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: study-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/study.sqlite3
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
